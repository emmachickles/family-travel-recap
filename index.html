<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Travel Recap 2026</title>
  
  <!-- Dependencies: Three.js, Globe.gl, and EXIF-js -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050814;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #globeViz {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* UI Overlay Containers */
    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 14px;
      color: #94a3b8;
    }
    
    /* Drag & Drop Zone */
    #drop-zone {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 13px;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #drop-zone:hover, #drop-zone.dragover {
      border-color: #38bdf8;
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
    }

    /* Timeline & Controls Bar */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 600px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .controls-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .timeline-title {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }
    input[type=range] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.active { display: flex; }
    .lightbox-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .lightbox-img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      background: #1e293b;
    }
    .lightbox-body { padding: 20px; }
    .lightbox-body h3 { margin-bottom: 6px; font-size: 18px; }
    .lightbox-body p { color: #94a3b8; font-size: 14px; line-height: 1.4; }
    .lightbox-close {
      float: right;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Our 2026 Travel Recap</h1>
    <p>Interactive timeline & flight archive</p>
  </div>

  <div id="drop-zone">
    <span>📷</span>
    <span>Drag & drop photos here to auto-plot</span>
  </div>

  <div id="globeViz"></div>

  <div class="controls">
    <div class="controls-top">
      <button class="btn" id="playBtn">▶ Play Journey</button>
      <div class="timeline-title" id="tripLabel">Japan (June 2026)</div>
    </div>
    <input type="range" id="timelineSlider" min="0" max="1" step="1" value="0">
  </div>

  <!-- Photo Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <img id="lightboxImg" class="lightbox-img" src="" alt="Trip photo">
      <div class="lightbox-body">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <h3 id="lightboxTitle">Trip Highlight</h3>
        <p id="lightboxDesc"></p>
      </div>
    </div>
  </div>

  <script>
    // Initial Travel Data
    let travelData = {
      trips: [
        {
          id: "japan",
          title: "Tokyo & Kyoto with Her Parents",
          date: "June 2026",
          from: [37.7749, -122.4194], // SFO
          to: [35.6762, 139.6503],    // Tokyo
          photo: "photos/japan.jpg",
          desc: "Explored Shinjuku and visited temples with Sam's parents!"
        },
        {
          id: "singapore",
          title: "Singapore with My Parents",
          date: "August 2026",
          from: [37.7749, -122.4194], // SFO
          to: [1.3521, 103.8198],     // Singapore
          photo: "photos/singapore.jpg",
          desc: "Visited Gardens by the Bay and sampled hawker food with Alex's parents!"
        }
      ]
    };

    let currentIndex = 0;
    let isPlaying = false;
    let playInterval = null;

    // Initialize 3D Globe
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .arcColor(() => '#38bdf8')
      .arcDashLength(0.4)
      .arcDashGap(0.2)
      .arcDashAnimateTime(1500)
      .arcStroke(1.5)
      .htmlElement(d => {
        const el = document.createElement('div');
        el.innerHTML = `
          <div style="background: rgba(14, 165, 233, 0.85); border: 2px solid white; width: 16px; height: 16px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px #38bdf8;"></div>
        `;
        el.onclick = () => showLightbox(d);
        return el;
      });

    function updateGlobe() {
      const trip = travelData.trips[currentIndex];

      // Update Arcs
      const arcsData = [{
        startLat: trip.from[0],
        startLng: trip.from[1],
        endLat: trip.to[0],
        endLng: trip.to[1]
      }];

      // Update Markers
      const htmlData = [{
        lat: trip.to[0],
        lng: trip.to[1],
        ...trip
      }];

      world
        .arcsData(arcsData)
        .htmlElementsData(htmlData)
        .pointOfView({ lat: trip.to[0], lng: trip.to[1], altitude: 1.8 }, 2000);

      document.getElementById('tripLabel').innerText = `${trip.title} (${trip.date})`;
      document.getElementById('timelineSlider').value = currentIndex;
    }

    // Lightbox handling
    function showLightbox(trip) {
      document.getElementById('lightboxImg').src = trip.photo;
      document.getElementById('lightboxTitle').innerText = trip.title;
      document.getElementById('lightboxDesc').innerText = trip.desc;
      document.getElementById('lightbox').classList.add('active');
    }

    document.getElementById('lightboxClose').onclick = () => {
      document.getElementById('lightbox').classList.remove('active');
    };

    // Timeline Controls
    const slider = document.getElementById('timelineSlider');
    const playBtn = document.getElementById('playBtn');

    slider.oninput = (e) => {
      currentIndex = parseInt(e.target.value);
      updateGlobe();
    };

    playBtn.onclick = () => {
      isPlaying = !isPlaying;
      playBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play Journey";
      if (isPlaying) {
        playInterval = setInterval(() => {
          currentIndex = (currentIndex + 1) % travelData.trips.length;
          updateGlobe();
        }, 4000);
      } else {
        clearInterval(playInterval);
      }
    };

    // Drag and Drop EXIF Parsing
    const dropZone = document.getElementById('drop-zone');

    ['dragenter', 'dragover'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
          const imgUrl = evt.target.result;
          
          EXIF.getData(file, function() {
            const lat = EXIF.getTag(this, "GPSLatitude");
            const latRef = EXIF.getTag(this, "GPSLatitudeRef");
            const lon = EXIF.getTag(this, "GPSLongitude");
            const lonRef = EXIF.getTag(this, "GPSLongitudeRef");

            if (lat && lon) {
              const decimalLat = convertDMSToDD(lat, latRef);
              const decimalLon = convertDMSToDD(lon, lonRef);

              const newTrip = {
                id: `custom-${Date.now()}`,
                title: file.name.replace(/\.[^/.]+$/, ""),
                date: "Added Photo",
                from: [37.7749, -122.4194],
                to: [decimalLat, decimalLon],
                photo: imgUrl,
                desc: `Auto-plotted from EXIF GPS coordinates: [${decimalLat.toFixed(2)}, ${decimalLon.toFixed(2)}]`
              };

              travelData.trips.push(newTrip);
              slider.max = travelData.trips.length - 1;
              currentIndex = travelData.trips.length - 1;
              updateGlobe();
            } else {
              alert(`No GPS coordinates found in metadata for "${file.name}".`);
            }
          });
        };
        reader.readAsDataURL(file);
      });
    });

    function convertDMSToDD(dms, ref) {
      let dd = dms[0] + (dms[1] / 60) + (dms[2] / 3600);
      if (ref === "S" || ref === "W") dd *= -1;
      return dd;
    }

    // Initial setup
    slider.max = travelData.trips.length - 1;
    updateGlobe();
  </script>
</body>
</html>
